apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  alerts.yml: |
    groups:
      - name: jvm
        rules:
          - alert: JvmHeapMemoryHigh
            expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} * 100 > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "JVM heap memory high"
              description: "Heap usage is {{ humanize $value }}% — instance: {{ $labels.instance }}"
