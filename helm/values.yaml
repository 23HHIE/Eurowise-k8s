global:
  namespace: eurowise

backend:
  image:
    repository: eurowiseacr.azurecr.io/eurowise-backend
    tag: latest
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  hpa:
    minReplicas: 1
    maxReplicas: 3
    cpuUtilization: 70

frontend:
  image:
    repository: eurowiseacr.azurecr.io/eurowise-frontend
    tag: latest
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  hpa:
    minReplicas: 1
    maxReplicas: 3
    cpuUtilization: 70  

mysql:
  image: mysql:8.0
  database: expensedb
  user: expenseuser

ingress:
  host: eurowise.online
  tlsSecretName: eurowise-tls
  clusterIssuer: letsencrypt-prod
